[project]
name = "ankglish"
schema = "deck-note-v1"
language = "en"

[sources.frequency]
provider = "wordfreq"
version = "pinned-in-lockfile"
max_rank = 60000

[sources.dictionary]
provider = "merriam-webster-learner"
fallback = "kaikki-wiktionary"
max_concurrency = 8

[translations]
enabled = false

[audio]
package_headword_audio = true
example_tts_enabled = false

[credentials]
learner_env = "MWLD_LEARNER_API_KEY"
elementary_env = "MWLD_ELEMENTARY_API_KEY"