name: Monthly ankglish release

on:
  schedule:
    - cron: "17 3 1 * *"
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a GitHub release after validation
        required: true
        default: false
        type: boolean
      max_rank:
        description: Maximum word frequency rank to fetch
        required: true
        default: "60000"
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      MWLD_LEARNER_API_KEY: ${{ secrets.MWLD_LEARNER_API_KEY }}
      MWLD_ELEMENTARY_API_KEY: ${{ secrets.MWLD_ELEMENTARY_API_KEY }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install project
        run: pip install .[dev]
      - name: Run tests
        run: pytest -q
      - name: Build refreshed full and standard decks
        env:
          MAX_RANK: ${{ inputs.max_rank || '60000' }}
        run: ankglish rebuild --refresh --max-rank "$MAX_RANK" --output-dir dist
      - name: Upload validated artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ankglish-build
          path: dist/

  publish:
    if: github.event_name == 'schedule' || inputs.publish == true
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ankglish-build
          path: dist
      - name: Create monthly release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(date -u +%Y.%m)"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; refusing to overwrite it."
            exit 1
          fi
          gh release create "$tag" dist/* --generate-notes --title "ankglish $tag"
